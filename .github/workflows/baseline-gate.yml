# Baseline delta gate — runs on every push (offline demo, no secrets)
name: Baseline gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  baseline-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - yc-prod-baseline
          - aws-prod-baseline
          - azure-prod-baseline
          - gcs-prod-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: FounderB/BucketScanner/action@v1.3.0
        with:
          version: "1.3.0"
          profile: ${{ matrix.profile }}
          config-path: examples/ci/.bucket-scanner.toml
          fail-on: new
          sarif-path: bucket-scanner-${{ matrix.profile }}.sarif
          json-path: report-${{ matrix.profile }}.json
          compliance-report-path: compliance-${{ matrix.profile }}.json
          run-doctor: "false"
        continue-on-error: true
      - name: Verify baseline delta passed
        run: test -s report-${{ matrix.profile }}.json
