# Baseline delta gate — runs on every push (offline demo, no secrets)
name: Baseline gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  baseline-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - yc-prod-baseline
          - aws-prod-baseline
          - azure-prod-baseline
          - gcs-prod-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          profile: ${{ matrix.profile }}
          config-path: examples/ci/.bucket-scanner.toml
          fail-on: new
          sarif-path: bucket-scanner-${{ matrix.profile }}.sarif
          json-path: report-${{ matrix.profile }}.json
          compliance-report-path: compliance-${{ matrix.profile }}.json
          run-doctor: "false"
      - name: Assert gate produced a report
        run: test -s report-${{ matrix.profile }}.json
      - name: Fail when baseline delta has new findings
        run: |
          python3 - <<'PY'
          import json, sys
          path = "report-${{ matrix.profile }}.json"
          report = json.load(open(path, encoding="utf-8"))
          new_count = report.get("summary", {}).get("new", 0)
          if new_count:
              print(f"FAIL: {new_count} new finding(s)/chain(s) vs baseline", file=sys.stderr)
              sys.exit(1)
          print("OK: no new findings vs baseline")
          PY
