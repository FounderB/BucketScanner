name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  commit-identity:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify commit author on main
        run: |
          author=$(git log -1 --format='%an <%ae>')
          expected='FounderB <314388178+FounderB@users.noreply.github.com>'
          if [ "$author" != "$expected" ]; then
            echo "Unexpected commit author on main: $author"
            echo "Expected: $expected"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest with coverage
        run: pytest -q --cov=bucket_scanner --cov-report=term-missing --cov-fail-under=75
      - name: Bandit
        run: bandit -r src -q
      - name: pip-audit
        run: |
          pip install --upgrade pip "setuptools>=83"
          pip-audit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: |
          pip install build
          python -m build
          pip install dist/bucket_scanner-*.whl
          bucket-scanner --version
      - name: Smoke scan from installed wheel
        run: |
          bucket-scanner scan --fixture examples/demo-vulnerable/fixture.toml \
            --fail-on high -q || test $? -eq 1

  pypi-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from PyPI
        run: |
          pip install bucket-scanner
          bucket-scanner --version | grep -E '0\.(12|13)\.'
      - name: Fixture scan from PyPI package
        run: |
          curl -sL -o /tmp/fixture.toml \
            https://raw.githubusercontent.com/FounderB/BucketScanner/v0.12.0/examples/demo-vulnerable/fixture.toml
          bucket-scanner scan --fixture /tmp/fixture.toml --fail-on high -q || test $? -eq 1

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Legacy fixture scan
        run: |
          bucket-scanner scan --fixture examples/demo-vulnerable/fixture.toml \
            --sarif /tmp/report.sarif --fail-on high -q || test $? -eq 1
          bucket-scanner scan --cloud aws --fixture examples/demo-vulnerable/fixture-aws.toml \
            --fail-on high -q || test $? -eq 1
          bucket-scanner diff examples/demo-vulnerable/terraform-aws \
            --cloud aws --fixture examples/demo-vulnerable/fixture-aws.toml --json \
            || test $? -eq 1
      - name: Full stack demo
        run: |
          bucket-scanner scan --fixture examples/demo-vulnerable/fixture.toml \
            --repo examples/demo-vulnerable/repo \
            --tracefuse-report examples/demo-vulnerable/tracefuse-report.json \
            --prometheus /tmp/metrics.prom --fail-on high -q || test $? -eq 1
          test -s /tmp/metrics.prom

  profile-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [yc-fixture, aws-fixture, stack-fixture, azure-fixture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Scan profile ${{ matrix.profile }}
        run: |
          bucket-scanner scan \
            --profile "${{ matrix.profile }}" \
            --config examples/ci/.bucket-scanner.toml \
            --sarif "/tmp/${{ matrix.profile }}.sarif" \
            --fail-on high -q || test $? -eq 1
          test -s "/tmp/${{ matrix.profile }}.sarif"

  baseline-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Baseline delta gate
        run: |
          bucket-scanner scan --fixture examples/demo-vulnerable/fixture.toml \
            --write-baseline /tmp/baseline.json -q || test $? -eq 1
          bucket-scanner scan --fixture examples/demo-vulnerable/fixture.toml \
            --baseline /tmp/baseline.json --fail-on new -q
          test -s /tmp/baseline.json

  action-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          version: "0.12.0"
          profile: aws-fixture
          config-path: examples/ci/.bucket-scanner.toml
          fail-on: high
          json-path: bucket-scanner.json
        continue-on-error: true
      - name: Verify JSON report
        run: test -s bucket-scanner.json
