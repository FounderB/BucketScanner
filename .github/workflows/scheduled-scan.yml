name: Scheduled scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Scan profile from examples/ci/.bucket-scanner.toml
        required: true
        default: yc-fixture
        type: choice
        options:
          - yc-fixture
          - aws-fixture
          - stack-fixture
          - azure-fixture
          - gcs-fixture

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan profile
        uses: ./action
        with:
          profile: ${{ github.event.inputs.profile || 'yc-fixture' }}
          config-path: examples/ci/.bucket-scanner.toml
          fail-on: high
          sarif-path: bucket-scanner.sarif
          json-path: bucket-scanner.json
          prometheus-path: bucket-scanner.prom
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-scanner-${{ github.event.inputs.profile || 'yc-fixture' }}
          path: |
            bucket-scanner.json
            bucket-scanner.prom
            bucket-scanner.sarif
