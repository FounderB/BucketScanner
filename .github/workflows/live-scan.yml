# Live scan — fixture smoke always; live YC when secrets exist
name: Live scan

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Live profile (used when YC_TOKEN is set)
        default: yc-prod
        type: string
  schedule:
    # Daily 07:00 UTC — fixture smoke always; live if secrets present
    - cron: "0 7 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  fixture-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Fixture proof run
        run: |
          set +e
          bucket-scanner scan \
            --fixture examples/demo-vulnerable/fixture.toml \
            --fail-on high \
            --json --sarif fixture.sarif -q > fixture-report.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          bucket-scanner proof-log update --report fixture-report.json --log proofs/fp-log-ci.jsonl
          bucket-scanner proof-log summary --log proofs/fp-log-ci.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-proof
          path: |
            fixture-report.json
            fixture.sarif
            proofs/fp-log-ci.jsonl

  live-yc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect YC credentials
        id: creds
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          if [ -n "$YC_TOKEN" ]; then
            echo "has_yc=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_yc=false" >> "$GITHUB_OUTPUT"
            echo "::notice::YC_TOKEN not set — skipping live YC scan (fixture smoke still runs)"
          fi
      - name: Use prod config if present
        if: steps.creds.outputs.has_yc == 'true'
        run: |
          if [ ! -f .bucket-scanner.toml ]; then
            cp examples/ci/.bucket-scanner.prod.toml.example .bucket-scanner.toml
          fi
      - uses: ./action
        if: steps.creds.outputs.has_yc == 'true'
        with:
          profile: ${{ github.event.inputs.profile || 'yc-prod' }}
          config-path: .bucket-scanner.toml
          fail-on: high
          sarif-path: bucket-scanner.sarif
          json-path: bucket-scanner.json
          compliance-report-path: compliance.json
          run-doctor: "true"
          probe: "true"
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        continue-on-error: true
      - name: Update proof log from live report
        if: steps.creds.outputs.has_yc == 'true' && always()
        run: |
          if [ ! -f bucket-scanner.json ]; then
            echo "No live JSON report; skip proof-log"
            exit 0
          fi
          pip install -q .
          bucket-scanner proof-log update --report bucket-scanner.json --log proofs/fp-log-live.jsonl
          bucket-scanner proof-log summary --log proofs/fp-log-live.jsonl
      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.has_yc == 'true' && always()
        with:
          name: live-scan-report
          path: |
            bucket-scanner.json
            bucket-scanner.sarif
            compliance.json
            doctor-report.json
            proofs/fp-log-live.jsonl
