# CI / scheduled scan profiles — offline fixtures, no cloud secrets required.
# Docs: docs/GITHUB_ACTION.md

[[profiles]]
name = "yc-fixture"
cloud = "yandex"
fixture = "examples/demo-vulnerable/fixture.toml"
fail_on = "high"

[[profiles]]
name = "aws-fixture"
cloud = "aws"
fixture = "examples/demo-vulnerable/fixture-aws.toml"
terraform_path = "examples/demo-vulnerable/terraform-aws"
fail_on = "high"

[[profiles]]
name = "stack-fixture"
cloud = "yandex"
fixture = "examples/demo-vulnerable/fixture.toml"
repo_path = "examples/demo-vulnerable/repo"
tracefuse_report = "examples/demo-vulnerable/tracefuse-report.json"
terraform_path = "examples/demo-vulnerable/terraform"
fail_on = "high"

[[profiles]]
name = "azure-fixture"
cloud = "azure"
fixture = "examples/demo-vulnerable/fixture-azure.toml"
terraform_path = "examples/demo-vulnerable/terraform-azure"
fail_on = "high"

[[profiles]]
name = "gcs-fixture"
cloud = "gcs"
fixture = "examples/demo-vulnerable/fixture-gcs.toml"
terraform_path = "examples/demo-vulnerable/terraform-gcs"
fail_on = "high"

[[profiles]]
name = "strict-prod"
cloud = "yandex"
fixture = "examples/demo-vulnerable/fixture.toml"
terraform_path = "examples/demo-vulnerable/terraform"
probe = true
fail_on = "critical"

[[profiles]]
name = "audit-only"
cloud = "yandex"
fixture = "examples/demo-vulnerable/fixture.toml"
fail_on = "critical"

# --- Live prod templates (copy to repo-root .bucket-scanner.toml) ---
# Scope: set folder_id / folder_ids in profile OR pass --folder-id / cloud env secrets.

[[profiles]]
name = "yc-prod"
cloud = "yandex"
probe = true
fail_on = "high"
terraform_path = "terraform"

[[profiles]]
name = "yc-prod-baseline"
cloud = "yandex"
fixture = "examples/demo-vulnerable/fixture.toml"
fail_on = "new"
baseline_path = "baselines/yc-prod.json"

[[profiles]]
name = "aws-prod"
cloud = "aws"
aws_region = "eu-west-1"
fail_on = "high"
terraform_path = "terraform"

[[profiles]]
name = "aws-prod-baseline"
cloud = "aws"
fixture = "examples/demo-vulnerable/fixture-aws.toml"
fail_on = "new"
baseline_path = "baselines/aws-prod.json"

[[profiles]]
name = "azure-prod"
cloud = "azure"
probe = true
fail_on = "high"
terraform_path = "terraform"

[[profiles]]
name = "azure-prod-baseline"
cloud = "azure"
fixture = "examples/demo-vulnerable/fixture-azure.toml"
fail_on = "new"
baseline_path = "baselines/azure-prod.json"

[[profiles]]
name = "gcs-prod"
cloud = "gcs"
probe = true
fail_on = "high"
terraform_path = "terraform"

[[profiles]]
name = "gcs-prod-baseline"
cloud = "gcs"
fixture = "examples/demo-vulnerable/fixture-gcs.toml"
fail_on = "new"
baseline_path = "baselines/gcs-prod.json"

[serve]
addr = "127.0.0.1:9090"
interval_seconds = 300
profile = "yc-fixture"
