# Audit-only profile — report findings, gate on critical only
name: Audit-only profile

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FounderB/BucketScanner/action@v1.5.0
        with:
          version: "1.5.0"
          profile: audit-only
          config-path: examples/ci/.bucket-scanner.toml
          json-path: audit-report.json
          compliance-report-path: compliance.json
        continue-on-error: true
      - run: test -s audit-report.json && test -s compliance.json
