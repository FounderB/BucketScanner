# Copy into .github/workflows/ and set repository secrets.
#
# Secrets:
#   YC_TOKEN       — IAM token for Yandex Cloud (live yc-* profiles)
#   YC_FOLDER_ID   — optional; can live in .bucket-scanner.toml instead
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — for aws-* profiles
#   AZURE_* / GCP_* — for azure-prod / gcs-prod profiles

name: Object Storage security scan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".bucket-scanner.toml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Profile from .bucket-scanner.toml
        required: true
        default: yc-prod
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FounderB/BucketScanner/action@v1.7.1
        with:
          profile: ${{ github.event.inputs.profile || 'yc-prod' }}
          config-path: .bucket-scanner.toml
          fail-on: high
          sarif-path: bucket-scanner.sarif
          json-path: bucket-scanner.json
          compliance-report-path: compliance.json
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-scanner-report
          path: bucket-scanner.json
