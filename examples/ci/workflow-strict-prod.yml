# Strict production gate — probe enabled, fail only on critical
name: Strict prod profile

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FounderB/BucketScanner/action@v1.7.0
        with:
          version: "1.7.0"
          profile: strict-prod
          config-path: examples/ci/.bucket-scanner.toml
          fail-on: critical
          compliance-report-path: compliance.json
          sarif-path: bucket-scanner.sarif
        continue-on-error: true
      - run: test -s compliance.json
