# GCS — Workload Identity Federation (recommended) or service account key
#
# Prerequisites:
#   1. GCP service account with roles/storage.objectViewer + storage.buckets.list
#   2. Workload Identity Pool + Provider for GitHub OIDC
#
# Secrets:
#   GCP_PROJECT (or set in profile folder_id)
#   WIF_PROVIDER, GCP_SA_EMAIL — for google-github-actions/auth
#
# Replace workload_identity_provider and service_account.

name: Bucket Scanner (GCS OIDC)

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
          service_account: bucket-scanner@my-project.iam.gserviceaccount.com
      - uses: FounderB/BucketScanner/action@v1.6.0
        with:
          profile: gcs-prod
          config-path: .bucket-scanner.toml
          folder-id: ${{ secrets.GCP_PROJECT }}
          fail-on: new
          baseline-path: baselines/gcs-prod.json
          sarif-path: bucket-scanner.sarif
          compliance-report-path: compliance.json
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
