name: "Scan with Bucket Scanner"
description: "Run Bucket Scanner against Yandex Cloud or AWS S3 using CLI flags or named scan profiles"
inputs:
  cloud:
    description: "Cloud backend when not using profile: yandex or aws"
    required: false
    default: yandex
  folder-id:
    description: "Yandex Cloud folder ID (yandex cloud) or scope label"
    required: false
  aws-region:
    description: "AWS region for S3 API calls"
    required: false
    default: us-east-1
  profile:
    description: "Named scan profile from config-path (recommended for CI)"
    required: false
  config-path:
    description: "Path to .bucket-scanner.toml with [[profiles]]"
    required: false
    default: .bucket-scanner.toml
  terraform-path:
    description: "Optional Terraform directory for IaC drift checks"
    required: false
  probe:
    description: "Enable anonymous reachability probe"
    required: false
    default: "false"
  fail-on:
    description: "Severity threshold"
    required: false
    default: high
  sarif-path:
    description: "SARIF output path"
    required: false
    default: bucket-scanner.sarif
  json-path:
    description: "Optional JSON report output path"
    required: false
  prometheus-path:
    description: "Optional Prometheus metrics output path"
    required: false
runs:
  using: composite
  steps:
    - name: Install Bucket Scanner
      shell: bash
      run: pip install .
    - name: Scan
      shell: bash
      env:
        YC_TOKEN: ${{ env.YC_TOKEN }}
        YC_FOLDER_ID: ${{ env.YC_FOLDER_ID }}
        AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ env.AWS_REGION }}
      run: |
        set -euo pipefail
        args=(scan --fail-on "${{ inputs.fail-on }}" -q)
        config_path="${{ inputs.config-path }}"
        if [ -f "$config_path" ]; then
          args+=(--config "$config_path")
        fi
        if [ -n "${{ inputs.profile }}" ]; then
          args+=(--profile "${{ inputs.profile }}")
        else
          args+=(--cloud "${{ inputs.cloud }}")
          if [ "${{ inputs.cloud }}" = "aws" ]; then
            args+=(--aws-region "${{ inputs.aws-region }}")
          fi
        fi
        if [ -n "${{ inputs.folder-id }}" ]; then
          args+=(--folder-id "${{ inputs.folder-id }}")
        fi
        if [ -n "${{ inputs.terraform-path }}" ]; then
          args+=(--terraform "${{ inputs.terraform-path }}")
        fi
        if [ "${{ inputs.probe }}" = "true" ]; then
          args+=(--probe)
        fi
        args+=(--sarif "${{ inputs.sarif-path }}")
        if [ -n "${{ inputs.prometheus-path }}" ]; then
          args+=(--prometheus "${{ inputs.prometheus-path }}")
        fi
        if [ -n "${{ inputs.json-path }}" ]; then
          bucket-scanner "${args[@]}" --json | tee "${{ inputs.json-path }}"
        else
          bucket-scanner "${args[@]}"
        fi
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-path }}
