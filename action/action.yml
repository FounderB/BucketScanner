name: "Scan with Bucket Scanner"
description: "Run Bucket Scanner against Yandex Cloud, AWS S3, Azure Blob, or GCS using CLI flags or named scan profiles"
inputs:
  version:
    description: "Install bucket-scanner from PyPI at this version (e.g. 1.1.0)"
    required: false
    default: ""
  cloud:
    description: "Cloud backend when not using profile: yandex, aws, azure, or gcs"
    required: false
    default: yandex
  folder-id:
    description: "Yandex folder ID, Azure subscription ID, or GCP project ID"
    required: false
  aws-region:
    description: "AWS region for S3 API calls"
    required: false
    default: us-east-1
  profile:
    description: "Named scan profile from config-path (recommended for CI)"
    required: false
  config-path:
    description: "Path to .bucket-scanner.toml with [[profiles]]"
    required: false
    default: .bucket-scanner.toml
  terraform-path:
    description: "Optional Terraform directory for IaC drift checks"
    required: false
  repo-path:
    description: "Optional repository root for secret pattern scan"
    required: false
  tracefuse-report:
    description: "Optional Tracefuse JSON report for cross-stack findings"
    required: false
  probe:
    description: "Enable anonymous reachability probe"
    required: false
    default: "false"
  fail-on:
    description: "Severity threshold, or 'new' with baseline-path"
    required: false
    default: high
  sarif-path:
    description: "SARIF output path"
    required: false
    default: bucket-scanner.sarif
  json-path:
    description: "Optional JSON report output path"
    required: false
  compliance-report-path:
    description: "Optional compliance control aggregation JSON path"
    required: false
  baseline-path:
    description: "Previous JSON report for delta (new_findings)"
    required: false
  write-baseline-path:
    description: "Write post-gate JSON baseline after scan"
    required: false
  prometheus-path:
    description: "Optional Prometheus metrics output path"
    required: false
runs:
  using: composite
  steps:
    - name: Install Bucket Scanner
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install "bucket-scanner==${{ inputs.version }}"
        elif [ -f pyproject.toml ] && grep -q 'name = "bucket-scanner"' pyproject.toml; then
          pip install .
        else
          pip install bucket-scanner
        fi
    - name: Scan
      shell: bash
      env:
        YC_TOKEN: ${{ env.YC_TOKEN }}
        YC_FOLDER_ID: ${{ env.YC_FOLDER_ID }}
        AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ env.AWS_REGION }}
        AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
        AZURE_CLIENT_SECRET: ${{ env.AZURE_CLIENT_SECRET }}
        AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        GCP_PROJECT: ${{ env.GCP_PROJECT }}
        GOOGLE_CLOUD_PROJECT: ${{ env.GOOGLE_CLOUD_PROJECT }}
      run: |
        set -euo pipefail
        args=(scan --fail-on "${{ inputs.fail-on }}" -q)
        config_path="${{ inputs.config-path }}"
        if [ -f "$config_path" ]; then
          args+=(--config "$config_path")
        fi
        if [ -n "${{ inputs.profile }}" ]; then
          args+=(--profile "${{ inputs.profile }}")
        else
          args+=(--cloud "${{ inputs.cloud }}")
          if [ "${{ inputs.cloud }}" = "aws" ]; then
            args+=(--aws-region "${{ inputs.aws-region }}")
          fi
        fi
        if [ -n "${{ inputs.folder-id }}" ]; then
          args+=(--folder-id "${{ inputs.folder-id }}")
        fi
        if [ -n "${{ inputs.terraform-path }}" ]; then
          args+=(--terraform "${{ inputs.terraform-path }}")
        fi
        if [ -n "${{ inputs.repo-path }}" ]; then
          args+=(--repo "${{ inputs.repo-path }}")
        fi
        if [ -n "${{ inputs.tracefuse-report }}" ]; then
          args+=(--tracefuse-report "${{ inputs.tracefuse-report }}")
        fi
        if [ -n "${{ inputs.baseline-path }}" ]; then
          args+=(--baseline "${{ inputs.baseline-path }}")
        fi
        if [ -n "${{ inputs.write-baseline-path }}" ]; then
          args+=(--write-baseline "${{ inputs.write-baseline-path }}")
        fi
        if [ "${{ inputs.probe }}" = "true" ]; then
          args+=(--probe)
        fi
        if [ -n "${{ inputs.compliance-report-path }}" ]; then
          args+=(--compliance-report "${{ inputs.compliance-report-path }}")
        fi
        args+=(--sarif "${{ inputs.sarif-path }}")
        if [ -n "${{ inputs.prometheus-path }}" ]; then
          args+=(--prometheus "${{ inputs.prometheus-path }}")
        fi
        if [ -n "${{ inputs.json-path }}" ]; then
          bucket-scanner "${args[@]}" --json | tee "${{ inputs.json-path }}"
        else
          bucket-scanner "${args[@]}"
        fi
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-path }}
