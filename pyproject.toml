[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bucket-scanner"
version = "1.1.0"
description = "Declared vs real — Object Storage security scanner (Yandex Cloud + AWS S3 + Azure + GCS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "FounderB" }]
keywords = [
    "yandex-cloud",
    "aws",
    "s3",
    "object-storage",
    "bucket-scanner",
    "security",
    "cspm",
    "devsecops",
    "sarif",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.16",
    "azure-mgmt-storage>=21.0",
    "azure-storage-blob>=12.19",
]
gcs = [
    "google-cloud-storage>=2.18",
]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
]

[project.scripts]
bucket-scanner = "bucket_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/FounderB/BucketScanner"
Repository = "https://github.com/FounderB/BucketScanner"
Issues = "https://github.com/FounderB/BucketScanner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
